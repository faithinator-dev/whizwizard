<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="winnerBodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff8c00;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Body -->
  <ellipse cx="100" cy="120" rx="45" ry="55" fill="url(#winnerBodyGrad)"/>
  
  <!-- Head -->
  <circle cx="100" cy="60" r="35" fill="#00d4ff"/>
  
  <!-- Joyful Eyes -->
  <path d="M 85 55 Q 90 45 95 55" stroke="#0a1929" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M 105 55 Q 110 45 115 55" stroke="#0a1929" stroke-width="3" fill="none" stroke-linecap="round"/>
  
  <!-- Huge Smile -->
  <path d="M 80 70 Q 100 85 120 70" stroke="white" stroke-width="4" fill="none" stroke-linecap="round"/>
  
  <!-- Trophy -->
  <g transform="translate(130, 80)">
    <path d="M 0 0 L 30 0 L 25 25 Q 15 35 5 25 Z" fill="#ffd700" stroke="#b8860b" stroke-width="2"/>
    <path d="M 5 30 L 25 30 L 15 5 Z" fill="#ffd700" opacity="0.5"/>
    <rect x="12" y="30" width="6" height="10" fill="#b8860b"/>
    <rect x="5" y="40" width="20" height="5" rx="2" fill="#b8860b"/>
    <animateTransform attributeName="transform" type="translate" values="130 80; 130 70; 130 80" dur="1s" repeatCount="indefinite" additive="sum"/>
  </g>
  
  <!-- Waving Arm -->
  <path d="M 60 110 Q 40 80 50 60" stroke="url(#winnerBodyGrad)" stroke-width="15" stroke-linecap="round" fill="none">
    <animateTransform attributeName="transform" type="rotate" from="0 60 110" to="20 60 110" dur="0.5s" repeatCount="indefinite" />
  </path>
  
  <!-- Confetti bits -->
  <circle cx="40" cy="40" r="3" fill="#ff4757"><animate attributeName="cy" values="40;180" dur="2s" repeatCount="indefinite"/></circle>
  <rect x="160" y="20" width="4" height="4" fill="#2ed573"><animate attributeName="cy" values="20;180" dur="2.5s" repeatCount="indefinite"/></rect>
  <path d="M 100 10 L 104 14" stroke="#ffa502" stroke-width="2"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></path>
</svg>