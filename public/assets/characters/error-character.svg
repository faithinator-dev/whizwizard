<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="errorBodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ff4757;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c0392b;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Body -->
  <ellipse cx="100" cy="120" rx="45" ry="55" fill="url(#errorBodyGrad)"/>
  
  <!-- Head -->
  <circle cx="100" cy="65" r="35" fill="#00d4ff"/>
  
  <!-- Worried Eyes -->
  <circle cx="88" cy="60" r="6" fill="white"/>
  <circle cx="112" cy="60" r="6" fill="white"/>
  <circle cx="90" cy="62" r="3" fill="#0a1929"/>
  <circle cx="110" cy="62" r="3" fill="#0a1929"/>
  
  <!-- Wobbly Mouth -->
  <path d="M 90 85 Q 100 75 110 85" stroke="white" stroke-width="3" fill="none" stroke-linecap="round">
    <animate attributeName="d" values="M 90 85 Q 100 75 110 85; M 90 80 Q 100 90 110 80; M 90 85 Q 100 75 110 85" dur="1s" repeatCount="indefinite"/>
  </path>
  
  <!-- Warning Sign -->
  <g transform="translate(140, 90)">
    <path d="M 0 30 L 15 0 L 30 30 Z" fill="#f1c40f" stroke="#0a1929" stroke-width="2"/>
    <text x="12" y="25" font-family="Arial" font-size="16" font-weight="bold" fill="#0a1929">!</text>
    <animateTransform attributeName="transform" type="scale" values="1;1.2;1" dur="1s" repeatCount="indefinite" transform-origin="center"/>
  </g>
  
  <!-- Confusion marks -->
  <text x="60" y="40" font-family="Arial" font-size="20" fill="white" opacity="0.6">?</text>
  <text x="130" y="30" font-family="Arial" font-size="14" fill="white" opacity="0.4">?</text>
</svg>