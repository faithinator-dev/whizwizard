<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Quiz - WhizWizard</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/animations.css">
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-left">
                <button class="hamburger" id="hamburger" aria-label="Toggle menu">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
                <div class="logo">
                    <img src="assets/icons/logo.svg" alt="WhizWizard Logo" class="logo-icon">
                    <span class="logo-text">WhizWizard</span>
                </div>
            </div>
            
            <ul class="nav-menu" id="nav-menu">
                <!-- User profile section (mobile only) -->
                <div class="mobile-user-profile" id="mobile-user-profile">
                    <!-- Populated by JavaScript -->
                </div>
                
                <li class="nav-item">
                    <a href="index.html" class="nav-link">
                        <img src="assets/icons/home.svg" alt="Home" class="nav-icon">
                        <span>Home</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="create-quiz.html" class="nav-link active">
                        <img src="assets/icons/create.svg" alt="Create" class="nav-icon">
                        <span>Create Quiz</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="my-quizzes.html" class="nav-link">
                        <img src="assets/icons/quiz.svg" alt="Quizzes" class="nav-icon">
                        <span>My Quizzes</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="leaderboard.html" class="nav-link">
                        <img src="assets/icons/trophy.svg" alt="Leaderboard" class="nav-icon">
                        <span>Leaderboard</span>
                    </a>
                </li>
                
                <!-- Mobile logout (shown when logged in) -->
                <div class="mobile-logout" id="mobile-logout">
                    <!-- Populated by JavaScript -->
                </div>
            </ul>
            <div class="nav-auth" id="nav-auth">
                <!-- Will be populated by JavaScript -->
            </div>
        </div>
    </nav>

    <main class="main-content">
        <div class="create-quiz-container">
            <div class="page-header">
                <h1 class="page-title">Create New Quiz</h1>
                <p class="page-subtitle">Fill in the details to create your quiz</p>
            </div>

            <!-- AI Magic Generator Section -->
            <div class="form-section ai-magic-section animated-glow" style="border: 2px solid #6a11cb; background: rgba(106, 17, 203, 0.05);">
                <h3 class="form-section-title" style="color: #00d4ff;">
                    <img src="assets/characters/wizard-character.svg" alt="AI Wizard" class="section-icon" style="height: 40px; margin-top: -10px;">
                    AI Sorcerer: Magic Quiz Generator
                </h3>
                <p style="margin-bottom: 1rem; font-size: 0.9rem; opacity: 0.8;">Enter a topic and let the AI Wizard cast a spell to generate questions for you instantly!</p>
                <div class="form-row" style="align-items: flex-end;">
                    <div class="form-group" style="flex: 2;">
                        <label class="form-label">Quiz Topic</label>
                        <input type="text" id="ai-topic" class="form-input" placeholder="e.g. Ancient Egypt, JavaScript Basics, Space Exploration">
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <button type="button" class="btn btn-primary btn-full" id="magic-generate-btn" style="background: linear-gradient(135deg, #6a11cb, #2575fc);">
                            <img src="assets/icons/save.svg" alt="Magic" class="btn-icon" style="filter: hue-rotate(90deg);">
                            Magic Generate
                        </button>
                    </div>
                </div>
            </div>

            <form id="create-quiz-form" class="quiz-form">
                <div class="form-section">
                    <h3 class="form-section-title">
                        <img src="assets/icons/info.svg" alt="Info" class="section-icon">
                        Quiz Information
                    </h3>
                    
                    <div class="form-group">
                        <label for="quiz-title" class="form-label">Quiz Title</label>
                        <input type="text" id="quiz-title" class="form-input" placeholder="Enter quiz title" required>
                    </div>

                    <div class="form-group">
                        <label for="quiz-description" class="form-label">Description</label>
                        <textarea id="quiz-description" class="form-textarea" placeholder="Enter quiz description" rows="3" required></textarea>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="quiz-category" class="form-label">Category</label>
                            <select id="quiz-category" class="form-select" required>
                                <option value="">Select Category</option>
                                <option value="science">Science</option>
                                <option value="history">History</option>
                                <option value="technology">Technology</option>
                                <option value="general">General Knowledge</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="quiz-timer" class="form-label">Time per Question (seconds)</label>
                            <input type="number" id="quiz-timer" class="form-input" placeholder="30" min="10" max="300" required>
                        </div>
                    </div>
                </div>

                <div class="form-section">
                    <div class="section-header-row">
                        <h3 class="form-section-title">
                            <img src="assets/icons/question.svg" alt="Questions" class="section-icon">
                            Questions
                        </h3>
                        <button type="button" class="btn btn-small btn-secondary" id="add-question-btn">
                            <img src="assets/icons/plus.svg" alt="Add" class="btn-icon">
                            Add Question
                        </button>
                    </div>

                    <div id="questions-container">
                        <!-- Questions will be added dynamically -->
                    </div>
                </div>

                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" onclick="window.location.href='index.html'">
                        <img src="assets/icons/close.svg" alt="Cancel" class="btn-icon">
                        Cancel
                    </button>
                    <button type="submit" class="btn btn-primary" id="submit-quiz-btn">
                        <img src="assets/icons/save.svg" alt="Save" class="btn-icon">
                        Create Quiz
                    </button>
                </div>
            </form>
        </div>

        <template id="question-card-template">
            <div class="form-group question-card animated-scale" style="background: rgba(255,255,255,0.05); padding: 1.5rem; border-radius: 12px; margin-bottom: 2rem; border-left: 4px solid #00d4ff;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                    <h4 style="margin: 0;">Question <span class="question-number">1</span></h4>
                    <button type="button" class="btn btn-small btn-danger remove-question-btn">
                        <img src="assets/icons/trash.svg" alt="Delete" class="btn-icon">
                        Remove
                    </button>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Question Text</label>
                    <textarea class="form-input question-text" rows="2" placeholder="Enter your question" required></textarea>
                </div>

                <!-- Image Upload for Question -->
                <div class="form-group">
                    <label class="form-label">Question Image (Optional)</label>
                    <div class="image-upload-area" style="border: 2px dashed rgba(255,255,255,0.2); padding: 1rem; border-radius: 8px; text-align: center;">
                        <input type="file" class="q-image-input" accept="image/*" style="display: none;">
                        <div class="image-preview hidden" style="margin-bottom: 1rem;">
                            <img src="" alt="Preview" style="max-width: 100%; max-height: 200px; border-radius: 8px;">
                            <br>
                            <button type="button" class="btn btn-small btn-danger remove-img-btn" style="margin-top: 0.5rem;">Remove Image</button>
                        </div>
                        <button type="button" class="btn btn-secondary upload-trigger-btn">
                            <img src="assets/icons/save.svg" alt="Upload" class="btn-icon" style="filter: invert(1);">
                            Choose Image
                        </button>
                        <input type="hidden" class="q-image-url">
                    </div>
                </div>

                <div class="options-container" style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                    <div class="option-group" style="display: flex; align-items: center; gap: 0.5rem;">
                        <input type="radio" name="correct-0" value="0" class="option-radio" required>
                        <input type="text" class="form-input option-text" placeholder="Option 1" required>
                    </div>
                    <div class="option-group" style="display: flex; align-items: center; gap: 0.5rem;">
                        <input type="radio" name="correct-0" value="1" class="option-radio">
                        <input type="text" class="form-input option-text" placeholder="Option 2" required>
                    </div>
                    <div class="option-group" style="display: flex; align-items: center; gap: 0.5rem;">
                        <input type="radio" name="correct-0" value="2" class="option-radio">
                        <input type="text" class="form-input option-text" placeholder="Option 3" required>
                    </div>
                    <div class="option-group" style="display: flex; align-items: center; gap: 0.5rem;">
                        <input type="radio" name="correct-0" value="3" class="option-radio">
                        <input type="text" class="form-input option-text" placeholder="Option 4" required>
                    </div>
                </div>
            </div>
        </template>

        <div class="character-helper">
            <img src="assets/characters/create-character.svg" alt="Helper" class="helper-img animated-bounce">
        </div>
    </main>

    <script src="js/firebase-config.js"></script>
    <script src="js/firebase-service.js"></script>
    <script src="js/quiz.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/button-loader.js"></script>
    <script src="js/mobile-nav.js"></script>
    <script src="js/create-quiz.js"></script>
</body>
</html>
